name: Build and Deploy Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mywebsite
  ECR_REGISTRY: 126309364316.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: latest
  EC2_INSTANCE_ID: i-0676aba6ad436f492

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Download the GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/github-mywebsite3-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # 6. Push Docker image to Amazon ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 7. Deploy Docker image to EC2 using AWS Systems Manager
      - name: Deploy to EC2
        run: |

          echo "Starting deployment to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mywebsite3 application" \
            --parameters 'commands=[
              "echo Starting deployment",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 126309364316.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 126309364316.dkr.ecr.us-east-1.amazonaws.com/mywebsite:latest",
              "docker stop mywebsite3-container || true",
              "docker rm mywebsite3-container || true",
              "docker run -d --name mywebsite3-container --restart unless-stopped -p 80:80 126309364316.dkr.ecr.us-east-1.amazonaws.com/mywebsite:latest",
              "docker ps"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 deployment to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Getting deployment result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

      # 8. Verify the container is running on EC2
      - name: Verify EC2 container
        run: |

          echo "Checking Docker container on EC2..."

          VERIFY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify mywebsite3 container" \
            --parameters 'commands=[
              "echo Container status:",
              "docker ps",
              "echo",
              "echo Docker images:",
              "docker images | head",
              "echo",
              "echo Testing website:",
              "curl -I http://localhost:80"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID: $VERIFY_COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

      # 9. Deployment complete
      - name: Deployment complete
        run: |
          echo "======================================"
          echo "   DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "ECR Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo ""
          echo "EC2 Instance:"
          echo "$EC2_INSTANCE_ID"
          echo ""
          echo "Website is running on port 80."
          echo "======================================"
